<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Wireframe 4 — Simple results dashboard (FR-13)</text>
  <!-- browser frame -->
  <rect x="24" y="52" width="912" height="560" rx="8" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <rect x="24" y="52" width="912" height="34" rx="8" fill="#ddd" stroke="#555" stroke-width="2"/>
  <rect x="120" y="60" width="500" height="18" rx="9" fill="#fff" stroke="#999"/>
  <text x="132" y="74" font-size="12" fill="#555">http://127.0.0.1:8050/</text>
  <text x="44" y="120" font-size="18" font-weight="bold" fill="#222">GSMF results</text>
  <text x="560" y="120" font-size="13" fill="#222">Run:</text>
  <rect x="596" y="104" width="220" height="26" fill="#fff" stroke="#555"/>
  <text x="606" y="122" font-size="13" fill="#222">RUN_ID (YYYY-MM-DD)</text>
  <text x="800" y="122" font-size="12" fill="#222">▾</text>
  <rect x="826" y="104" width="94" height="26" fill="#e8e8e8" stroke="#555"/>
  <text x="840" y="122" font-size="13" fill="#222">Export CSV</text>
  <!-- table -->
  <g font-size="13" fill="#222">
    <rect x="44" y="146" width="872" height="128" fill="#fff" stroke="#888"/>
    <rect x="44" y="146" width="872" height="30" fill="#ececec" stroke="#888"/>
    <text x="56" y="166" font-weight="bold">Target</text>
    <text x="156" y="166" font-weight="bold">Version</text>
    <text x="256" y="166" font-weight="bold">Valid / Inv / Fail</text>
    <text x="406" y="166" font-weight="bold">Net energy (J)</text>
    <text x="546" y="166" font-weight="bold">Energy/task (J/task)</text>
    <text x="716" y="166" font-weight="bold">EDP (J·s)</text>
    <text x="826" y="166" font-weight="bold">SCI*</text>
    <g fill="#444">
      <text x="56" y="198">fastapi</text><text x="156" y="198">v</text><text x="256" y="198">n / n / n</text><text x="406" y="198">x.xx ± x.xx</text><text x="546" y="198">x.xxxx ± x.xx</text><text x="716" y="198">x.x ± x.x</text><text x="826" y="198">x.xx</text>
      <text x="56" y="228">budibase</text><text x="156" y="228">v</text><text x="256" y="228">n / n / n</text><text x="406" y="228">x.xx ± x.xx</text><text x="546" y="228">x.xxxx ± x.xx</text><text x="716" y="228">x.x ± x.x</text><text x="826" y="228">x.xx</text>
      <text x="56" y="258">appsmith</text><text x="156" y="258">v</text><text x="256" y="258">n / n / n</text><text x="406" y="258">x.xx ± x.xx</text><text x="546" y="258">x.xxxx ± x.xx</text><text x="716" y="258">x.x ± x.x</text><text x="826" y="258">x.xx</text>
    </g>
    <line x1="44" y1="208" x2="916" y2="208" stroke="#ddd"/>
    <line x1="44" y1="238" x2="916" y2="238" stroke="#ddd"/>
  </g>
  <!-- charts -->
  <g font-size="13" fill="#222">
    <rect x="44" y="292" width="424" height="270" fill="#fff" stroke="#888"/>
    <text x="60" y="316" font-weight="bold">Energy per user task (J/task)</text>
    <line x1="90" y1="340" x2="90" y2="520" stroke="#555"/>
    <line x1="90" y1="520" x2="448" y2="520" stroke="#555"/>
    <rect x="120" y="450" width="70" height="70" fill="#bbb"/>
    <rect x="230" y="380" width="70" height="140" fill="#bbb"/>
    <rect x="340" y="400" width="70" height="120" fill="#bbb"/>
    <line x1="155" y1="440" x2="155" y2="460" stroke="#333"/><line x1="265" y1="368" x2="265" y2="392" stroke="#333"/><line x1="375" y1="390" x2="375" y2="410" stroke="#333"/>
    <text x="128" y="540">fastapi</text><text x="232" y="540">budibase</text><text x="340" y="540">appsmith</text>

    <rect x="492" y="292" width="424" height="270" fill="#fff" stroke="#888"/>
    <text x="508" y="316" font-weight="bold">Energy-Delay Product (J·s)</text>
    <line x1="538" y1="340" x2="538" y2="520" stroke="#555"/>
    <line x1="538" y1="520" x2="896" y2="520" stroke="#555"/>
    <rect x="568" y="470" width="70" height="50" fill="#bbb"/>
    <rect x="678" y="360" width="70" height="160" fill="#bbb"/>
    <rect x="788" y="390" width="70" height="130" fill="#bbb"/>
    <line x1="603" y1="462" x2="603" y2="478" stroke="#333"/><line x1="713" y1="348" x2="713" y2="372" stroke="#333"/><line x1="823" y1="380" x2="823" y2="400" stroke="#333"/>
    <text x="576" y="540">fastapi</text><text x="680" y="540">budibase</text><text x="788" y="540">appsmith</text>
  </g>
  <text x="44" y="582" font-size="12" fill="#555">* SCI in gCO2eq per 1,000 user tasks, operational only. Bars: mean, whiskers: 95% CI.</text>
  <text x="44" y="600" font-size="12" fill="#555">Values come from the stored aggregates and match aggregates_RUN_ID.csv of the selected run.</text>
  <text x="24" y="630" font-size="12" fill="#666">Low-fidelity wireframe; bar heights and table values are placeholders, not measurements.</text>
</svg>
